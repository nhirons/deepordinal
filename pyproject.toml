[project]
name = "deepordinal"
dynamic = ["version"]
description = "Ordinal output layers and loss functions (Rennie & Srebro, 2005) for PyTorch, TF/Keras, and JAX/Flax"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nicholas Hirons" }]
requires-python = ">=3.10"
dependencies = ["numpy"]
keywords = ["ordinal-regression", "deep-learning", "pytorch", "tensorflow", "keras", "jax", "flax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
tf = ["tensorflow>=2.15"]
jax = ["jax>=0.6; python_version >= '3.11'", "flax>=0.11; python_version >= '3.11'"]

[project.urls]
Repository = "https://github.com/nhirons/deepordinal"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "deepordinal.__version__" }

[tool.setuptools.packages.find]
include = ["deepordinal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
